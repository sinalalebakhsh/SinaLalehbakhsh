{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sina Lalehbakhsh | Django Backend Developer{% endblock %}</title>

    <meta
        name="description"
        content="{% block description %}Sina Lalehbakhsh — Django Backend Developer and Software Developer focused on Python, Django, REST APIs and scalable web applications.{% endblock %}"
    >

    <meta name="author" content="Sina Lalehbakhsh">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">


    
    <meta property="og:site_name" content="Sina Lalehbakhsh">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Sina Lalehbakhsh | Django Backend Developer{% endblock %}">
    <meta
        property="og:description"
        content="{% block og_description %}Django Backend Developer and Software Developer focused on Python, Django, REST APIs and scalable web applications.{% endblock %}"
    >
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'website/og-image.svg' %}">
    <meta property="og:image:type" content="image/svg+xml">

    <link rel="icon" type="image/svg+xml" href="{% static 'website/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'website/css/style.css' %}">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Sina Lalehbakhsh",
            "url": "{{ request.scheme }}://{{ request.get_host }}",
            "jobTitle": "Django Backend Developer"
        }
    </script>
    <!-- <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Sina Lalehbakhsh",
            "url": "{{ request.scheme }}://{{ request.get_host }}",
            "jobTitle": "Django Backend Developer",
            "sameAs": [
                "{{ page.linkedin_url|default:'' }}",
                "{{ page.github_url|default:'' }}"
            ]
        }
    </script> -->
</head>

<body>

<nav>
    <div class="container nav-container">

        <a href="/" class="brand">
            Sina Lalehbakhsh
        </a>

        <ul class="nav-links">
            <li><a href="/#about">About</a></li>
            <li><a href="/#skills">Skills</a></li>
            <li><a href="/#projects">Projects</a></li>
            <li><a href="{% url 'topic_index' %}">Topics</a></li>
            <li><a href="{% url 'search' %}">Search</a></li>
            <li><a href="/#experience">Experience</a></li>
            <li><a href="/#links">Links</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>

    </div>
</nav>

{% block content %}
{% endblock %}

<footer>
    <div class="container">
        <p>© {% now "Y" %} Sina Lalehbakhsh. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
