{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Server Error | Sina Lalehbakhsh</title>

    <meta
        name="description"
        content="An unexpected server error occurred."
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="{% static 'website/favicon.svg' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'website/css/style.css' %}"
    >
</head>

<body>

<main class="error-page">
    <div class="container">

        <div class="error-content">

            <p class="error-code">500</p>

            <h1>Something Went Wrong</h1>

            <p>
                An unexpected server error occurred.
                Please return to the homepage.
            </p>

            <a href="/" class="error-link">
                Back to Homepage
            </a>

        </div>

    </div>
</main>

</body>
</html>
